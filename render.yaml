services:
  # 1. Backend API (Web Service - Plan Free)
  - type: web
    name: rutazero-backend
    env: node
    plan: free 
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rutazero-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rutazero-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
    rootDirectory: backend

  # 2. Portal Web (Static Site - Plan Free)
  - type: web
    name: rutazero-portal
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDirectory: portal-web
    envVars:
      - key: VITE_API_URL
        value: https://rutazero-backend.onrender.com

databases:
  # 3. PostgreSQL Database (Plan Free)
  - name: rutazero-db
    plan: free
    region: ohio

# 4. Redis (Real-time Sync - Plan Free)
redis:
  name: rutazero-redis
  plan: free
  region: ohio
